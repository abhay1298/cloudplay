# Builds an UNSIGNED CloudPlay .ipa on GitHub's macOS runners (no Mac needed).
# Install it on your iPhone with Sideloadly or AltStore, which sign it with your own Apple ID.
#
# Runs automatically when native-config/server-url.txt (or the iOS project) changes, or manually:
# GitHub → Actions → "Build iOS app (.ipa)" → Run workflow.
# The .ipa is published on the Releases page and as a run artifact.
name: Build iOS app (.ipa)

on:
  push:
    branches: [main]
    paths:
      - "native-config/server-url.txt"
      - "ios/**"
      - "capacitor.config.ts"
      - "native-shell/**"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Your CloudPlay server address (https://…). Leave empty to use native-config/server-url.txt"
        required: false
        type: string
      version:
        description: "App version shown on the phone (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write # needed to publish the .ipa as a GitHub Release

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate settings
        id: cfg
        env:
          INPUT_URL: ${{ inputs.server_url }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SERVER_URL="$INPUT_URL"
          if [ -z "$SERVER_URL" ] && [ -f native-config/server-url.txt ]; then
            SERVER_URL="$(tr -d ' \r\n\t' < native-config/server-url.txt)"
          fi
          APP_VERSION="${INPUT_VERSION:-1.0.0}"
          if [ -z "$SERVER_URL" ]; then
            echo "::notice::No server address yet (native-config/server-url.txt is empty). Skipping the iOS build."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! [[ "$SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[^[:space:]]*)?$ ]]; then
            echo "::error::server address must be an https:// URL, got: $SERVER_URL"; exit 1
          fi
          if ! [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::version must look like 1.0.0, got: $APP_VERSION"; exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "server_url=$SERVER_URL" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.cfg.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund

      - name: Configure native app for your server
        if: steps.cfg.outputs.skip != 'true'
        env:
          CLOUDPLAY_SERVER_URL: ${{ steps.cfg.outputs.server_url }}
        run: npx cap sync ios

      - name: Show Xcode version and schemes
        if: steps.cfg.outputs.skip != 'true'
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build app (unsigned)
        if: steps.cfg.outputs.skip != 'true'
        env:
          APP_VERSION: ${{ steps.cfg.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/App.app || { echo "::error::Build failed, see xcodebuild.log artifact"; exit 1; }

      - name: Package .ipa
        if: steps.cfg.outputs.skip != 'true'
        env:
          APP_VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "CloudPlay-$APP_VERSION.ipa" Payload
          ls -lh *.ipa

      - name: Upload .ipa
        if: steps.cfg.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CloudPlay-ios-${{ steps.cfg.outputs.version }}-build${{ github.run_number }}
          path: CloudPlay-*.ipa
          retention-days: 30

      - name: Publish to Releases
        if: steps.cfg.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.cfg.outputs.version }}
          SERVER_URL: ${{ steps.cfg.outputs.server_url }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          TAG="ios-v${APP_VERSION}-build${BUILD_NUMBER}"
          gh release create "$TAG" CloudPlay-*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CloudPlay iOS ${APP_VERSION} (build ${BUILD_NUMBER})" \
            --notes "Unsigned .ipa for sideloading with Sideloadly or AltStore (see IOS_APP.md). Server: ${SERVER_URL}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
