<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CloudPlay</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#07070d; color:#ececf6; text-align:center;
         font-family: -apple-system, system-ui, sans-serif; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
  .logo { width:64px; height:64px; border-radius:18px; margin:0 auto 20px; display:grid; place-items:center; background:linear-gradient(135deg,#8b5cf6,#3b82f6); }
  h1 { font-size:20px; letter-spacing:.12em; margin:0 0 8px; }
  p { color:#9a9ab5; max-width:320px; line-height:1.5; margin:0 auto 20px; }
  button { font: inherit; font-weight:600; color:#fff; border:0; padding:10px 18px; border-radius:12px; background:linear-gradient(135deg,#8b5cf6,#3b82f6); }
</style>
</head>
<body>
  <main>
    <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>
    <h1>CLOUDPLAY</h1>
    <p>Can't reach your CloudPlay server. Check your internet connection and that the server is running.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
